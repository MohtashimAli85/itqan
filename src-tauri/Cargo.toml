[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["log"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
keyring = "4"
reqwest = { version = "0.13", features = ["json", "stream"] }
regex = "1"
rrule = "0.14"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "itqan"
version = "0.1.0"
description = "Open-source desktop companion that keeps you focused and growing"
authors = ["Mohtashim Ali"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "itqan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
itqan-contracts = { path = "crates/itqan-contracts" }
itqan-core = { path = "crates/itqan-core" }
itqan-salah = { path = "crates/itqan-salah" }
itqan-health = { path = "crates/itqan-health" }
itqan-tasks = { path = "crates/itqan-tasks" }
itqan-progress = { path = "crates/itqan-progress" }
tauri = { workspace = true, features = ["tray-icon", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tauri-plugin-log = "2.10.0"
tauri-specta.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
tauri-plugin-notification.workspace = true

[dev-dependencies]
itqan-core = { path = "crates/itqan-core", features = ["test-support"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart.workspace = true
tauri-plugin-single-instance = "2"

[profile.dev.package."*"]
debug = false
