stages:
  - check
  - rust

.node:
  image: node:24-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

.rust:
  image: rust:1.98-bookworm
  needs: [build]
  before_script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
    - rustup component add rustfmt clippy
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
    paths:
      - src-tauri/target

lint:
  extends: .node
  stage: check
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  extends: .node
  stage: check
  script:
    - pnpm typecheck

test:
  extends: .node
  stage: check
  script:
    - pnpm test

build:
  extends: .node
  stage: check
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

fmt:
  extends: .rust
  stage: rust
  script:
    - cargo fmt --manifest-path src-tauri/Cargo.toml --check

clippy:
  extends: .rust
  stage: rust
  script:
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

cargo-test:
  extends: .rust
  stage: rust
  script:
    - cargo test --manifest-path src-tauri/Cargo.toml

cargo-build:
  extends: .rust
  stage: rust
  script:
    - cargo check --manifest-path src-tauri/Cargo.toml --release
