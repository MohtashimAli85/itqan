[graph]
all-features = false

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; pulled in by specta, no maintained alternative upstream" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; pulled in by glib-macros (gtk, the Linux webview stack under tauri), no fix upstream" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
