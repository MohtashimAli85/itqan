[package]
name = "itqan"
version = "0.1.0"
description = "Open-source desktop companion that keeps you focused and growing"
authors = ["Mohtashim Ali"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "itqan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["log"] }
tauri-plugin-log = "2.10.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
specta-typescript = "0.0.12"
chrono = { version = "0.4.45", features = ["serde"] }
rrule = "0.14"
chrono-tz = "0.10"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-notification = "2"
keyring = "4"
reqwest = { version = "0.13", features = ["json", "stream"] }
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
